<!doctype html>
<html lang="en">
  <head>
    <!-- Basic SEO -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1f17" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Primary SEO -->
    <title>
      Luxury Gorilla Trekking & Safaris in Uganda & Rwanda | Nylora Safaris
    </title>

    <meta
      name="description"
      content="Experience luxury gorilla trekking and wildlife safaris in Uganda and Rwanda with Nylora Safaris. Discover tailor-made journeys, luxury lodges, chimpanzee tracking, private game drives, and unforgettable East African adventures."
    />

    <meta
      name="keywords"
      content="Nylora Safaris, Luxury Safaris Uganda, Luxury Safaris Rwanda, Gorilla Trekking Uganda, Gorilla Trekking Rwanda, Uganda Luxury Tours, Rwanda Luxury Tours, East Africa Luxury Safaris, Luxury Gorilla Safaris, Private Safaris Uganda, Luxury Safari Company Uganda"
    />

    <meta name="author" content="Nylora Safaris" />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://www.nylorasafaris.com/"
    />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Luxury Gorilla Trekking & Safaris in Uganda & Rwanda | Nylora Safaris"
    />

    <meta
      property="og:description"
      content="Discover bespoke luxury safaris across Uganda and Rwanda featuring exclusive gorilla trekking, luxury lodges, private wildlife safaris, chimpanzee tracking, and unforgettable African adventures."
    />

    <meta
      property="og:image"
      content="https://www.nylorasafaris.com/og-image.jpg"
    />

    <meta
      property="og:url"
      content="https://www.nylorasafaris.com/"
    />

    <meta
      property="og:site_name"
      content="Nylora Safaris"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Luxury Gorilla Trekking & Safaris in Uganda & Rwanda | Nylora Safaris"
    />

    <meta
      name="twitter:description"
      content="Tailor-made luxury safaris in Uganda and Rwanda featuring gorilla trekking, luxury accommodations, wildlife experiences, and personalized journeys."
    />

    <meta
      name="twitter:image"
      content="https://www.nylorasafaris.com/og-image.jpg"
    />

    <!-- Robots -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <!-- Geo SEO -->
    <meta name="geo.region" content="UG" />
    <meta name="geo.placename" content="Uganda" />

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "Nylora Safaris",
        "url": "https://www.nylorasafaris.com",
        "description": "Luxury gorilla trekking and wildlife safari company specializing in tailor-made safaris across Uganda and Rwanda.",
        "areaServed": [
          "Uganda",
          "Rwanda",
          "Kenya",
          "Tanzania"
        ],
        "serviceType": [
          "Luxury Safaris",
          "Gorilla Trekking",
          "Wildlife Safaris",
          "Chimpanzee Tracking",
          "Private Guided Tours"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
